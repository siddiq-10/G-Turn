<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | PlaySphere</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 10% 0%, rgba(0, 229, 168, 0.08), transparent 30%),
                radial-gradient(circle at 90% 0%, rgba(90, 80, 255, 0.08), transparent 30%),
                #070b12;
            color: #f4f7fb;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            font: inherit;
        }

        .navbar {
            min-height: 72px;
            padding: 0 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(7, 11, 18, 0.9);
            backdrop-filter: blur(14px);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .brand {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand span {
            color: #00e5a8;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .nav-link {
            padding: 9px 13px;
            border-radius: 9px;
            color: #aeb8c8;
            font-size: 0.93rem;
            transition: 0.2s;
        }

        .nav-link:hover,
        .nav-link.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 12px;
            padding-left: 14px;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-user-name {
            color: #dbe2ec;
            font-size: 0.9rem;
        }

        .avatar,
        .notification-avatar {
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #00e5a8, #007dff);
            color: #04100d;
            font-weight: 800;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }

        .avatar {
            width: 38px;
            height: 38px;
        }

        .page {
            width: min(900px, 92%);
            margin: auto;
            padding: 52px 0 80px;
        }

        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
        }

        .eyebrow {
            color: #00e5a8;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.72rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            line-height: 1;
            letter-spacing: -1.2px;
        }

        .subtitle {
            color: #8995a7;
            margin-top: 10px;
            line-height: 1.5;
        }

        .mark-all-btn {
            border: 1px solid rgba(0, 229, 168, 0.25);
            background: rgba(0, 229, 168, 0.07);
            color: #00e5a8;
            border-radius: 10px;
            padding: 10px 14px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .mark-all-btn:hover {
            background: rgba(0, 229, 168, 0.14);
        }

        .mark-all-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .notifications-card {
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            overflow: hidden;
            background: rgba(14, 20, 31, 0.82);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .notification {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 17px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
        }

        .notification:last-child {
            border-bottom: none;
        }

        .notification:hover {
            background: rgba(255, 255, 255, 0.035);
        }

        .notification.unread {
            background: rgba(0, 229, 168, 0.055);
        }

        .notification.unread::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00e5a8;
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
        }

        .notification-avatar {
            width: 46px;
            height: 46px;
        }

        .notification-body {
            flex: 1;
            min-width: 0;
        }

        .notification-text {
            color: #dce3ed;
            line-height: 1.45;
            font-size: 0.95rem;
        }

        .notification-text strong {
            color: #fff;
        }

        .notification-time {
            color: #758196;
            font-size: 0.78rem;
            margin-top: 5px;
        }

        .notification-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.07);
            flex-shrink: 0;
        }

        .unread-label {
            color: #00e5a8;
            font-size: 0.72rem;
            font-weight: 700;
            padding-left: 8px;
        }

        .state {
            padding: 70px 25px;
            text-align: center;
            color: #8995a7;
        }

        .state-icon {
            font-size: 2.7rem;
            margin-bottom: 14px;
        }

        .state h2 {
            color: #e8edf5;
            font-size: 1.25rem;
            margin-bottom: 8px;
        }

        .state p {
            line-height: 1.5;
        }

        .retry-btn {
            margin-top: 18px;
            border: 0;
            border-radius: 9px;
            padding: 10px 16px;
            background: #00e5a8;
            color: #04100d;
            font-weight: 750;
            cursor: pointer;
        }

        @media (max-width: 720px) {
            .navbar {
                padding: 12px 4%;
                gap: 10px;
                flex-wrap: wrap;
            }

            .nav-links {
                order: 3;
                width: 100%;
                justify-content: center;
            }

            .nav-user-name {
                display: none;
            }

            .nav-user {
                margin-left: auto;
                padding-left: 10px;
            }

            .page {
                width: 94%;
                padding-top: 34px;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .mark-all-btn {
                width: 100%;
            }

            .notification {
                padding: 15px;
                gap: 11px;
            }

            .notification-avatar {
                width: 42px;
                height: 42px;
            }

            .unread-label {
                display: none;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="dashboard.html" class="brand">Play<span>Sphere</span></a>

        <div class="nav-links">
            <a href="dashboard.html" class="nav-link">Home</a>
            <a href="communities.html" class="nav-link">Communities</a>
            <a href="profile.html" class="nav-link">Profile</a>
            <a href="notifications.html" class="nav-link active">🔔</a>
        </div>

        <a href="profile.html" class="nav-user">
            <span class="nav-user-name" id="navUserName">Player</span>
            <div class="avatar" id="navAvatar">P</div>
        </a>
    </nav>

    <main class="page">
        <header class="page-header">
            <div>
                <div class="eyebrow">PlaySphere</div>
                <h1>Notifications</h1>
                <p class="subtitle">Stay updated on activity around your posts.</p>
            </div>

            <button class="mark-all-btn" id="markAllBtn" type="button">
                Mark all as read
            </button>
        </header>

        <section class="notifications-card">
            <div id="notificationsContainer">
                <div class="state">
                    <div class="state-icon">⏳</div>
                    <h2>Loading notifications</h2>
                    <p>Please wait a moment...</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        const { createClient } = window.supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentUser = null;

        function escapeHTML(text) {
            const d = document.createElement("div");
            d.textContent = text ?? "";
            return d.innerHTML;
        }

        function initialOf(name) {
            return (name || "Player").trim().charAt(0).toUpperCase() || "P";
        }

        function relativeTime(ts) {
            const s = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);

            if (s < 60) {
                return "Just now";
            }

            const m = Math.floor(s / 60);

            if (m < 60) {
                return `${m} minute${m === 1 ? "" : "s"} ago`;
            }

            const h = Math.floor(m / 60);

            if (h < 24) {
                return `${h} hour${h === 1 ? "" : "s"} ago`;
            }

            const d = Math.floor(h / 24);

            if (d < 7) {
                return `${d} day${d === 1 ? "" : "s"} ago`;
            }

            return new Date(ts).toLocaleDateString([], {
                day: "numeric",
                month: "short",
                year: new Date(ts).getFullYear() !== new Date().getFullYear()
                    ? "numeric"
                    : undefined
            });
        }

        async function getCurrentUser() {
            const { data, error } = await supabaseClient.auth.getUser();

            if (error || !data.user) {
                window.location.href = "index.html";
                return false;
            }

            currentUser = data.user;
            return true;
        }

        async function loadNavUser() {
            const meta = currentUser.user_metadata || {};
            let firstName = meta.first_name || "Player";
            let avatarUrl = "";

            const { data, error } = await supabaseClient
                .from("profiles")
                .select("first_name, avatar_url")
                .eq("id", currentUser.id)
                .maybeSingle();

            if (!error && data) {
                firstName = data.first_name || firstName;
                avatarUrl = data.avatar_url || "";
            }

            document.getElementById("navUserName").textContent = firstName;

            const avatar = document.getElementById("navAvatar");

            if (avatarUrl) {
                avatar.textContent = "";
                avatar.style.backgroundImage = `url("${avatarUrl.replace(/"/g, "&quot;")}")`;
            } else {
                avatar.textContent = initialOf(firstName);
                avatar.style.backgroundImage = "";
            }
        }

        async function loadNotifications() {
            const container = document.getElementById("notificationsContainer");

            container.innerHTML = `
                <div class="state">
                    <div class="state-icon">⏳</div>
                    <h2>Loading notifications</h2>
                    <p>Please wait a moment...</p>
                </div>
            `;

            const { data: notifications, error } = await supabaseClient
                .from("notifications")
                .select("id, actor_id, type, post_id, comment_id, created_at, read")
                .eq("recipient_id", currentUser.id)
                .order("created_at", { ascending: false });

            if (error) {
                console.error(error);
                showError();
                return;
            }

            if (!notifications?.length) {
                showEmpty();
                updateMarkAllButton([]);
                return;
            }

            const ids = [
                ...new Set(
                    notifications
                        .map((notification) => notification.actor_id)
                        .filter(Boolean)
                )
            ];

            const profiles = {};

            if (ids.length) {
                const { data, error: profileError } = await supabaseClient
                    .from("profiles")
                    .select("id, first_name, last_name, avatar_url")
                    .in("id", ids);

                if (!profileError) {
                    (data || []).forEach((profile) => {
                        profiles[profile.id] = {
                            name:
                                [profile.first_name, profile.last_name]
                                    .filter(Boolean)
                                    .join(" ")
                                    .trim() || "Player",
                            avatarUrl: profile.avatar_url || ""
                        };
                    });
                }
            }

            renderNotifications(notifications, profiles);
            updateMarkAllButton(notifications);
        }

        function renderNotifications(list, profiles) {
            const container = document.getElementById("notificationsContainer");

            container.innerHTML = list
                .map((notification) => {
                    const profile = profiles[notification.actor_id] || {
                        name: "Player",
                        avatarUrl: ""
                    };

                    let text = `<strong>${escapeHTML(profile.name)}</strong> interacted with your post`;
                    let icon = "🔔";

                    if (notification.type === "like") {
                        text = `<strong>${escapeHTML(profile.name)}</strong> liked your post`;
                        icon = "❤️";
                    }

                    if (notification.type === "comment") {
                        text = `<strong>${escapeHTML(profile.name)}</strong> commented on your post`;
                        icon = "💬";
                    }

                    const style = profile.avatarUrl
                        ? `style="background-image:url('${escapeHTML(profile.avatarUrl)}');background-size:cover;background-position:center;color:transparent"`
                        : "";

                    return `
                        <article
                            class="notification ${notification.read ? "" : "unread"}"
                            data-id="${escapeHTML(notification.id)}"
                            data-post-id="${escapeHTML(notification.post_id || "")}"
                            data-read="${notification.read}"
                        >
                            <div class="notification-avatar" ${style}>
                                ${profile.avatarUrl ? "" : escapeHTML(initialOf(profile.name))}
                            </div>

                            <div class="notification-body">
                                <div class="notification-text">${text}</div>
                                <div class="notification-time">
                                    ${escapeHTML(relativeTime(notification.created_at))}
                                </div>
                            </div>

                            <div class="notification-icon">${icon}</div>

                            ${
                                notification.read
                                    ? ""
                                    : '<div class="unread-label">NEW</div>'
                            }
                        </article>
                    `;
                })
                .join("");
        }

        function showEmpty() {
            document.getElementById("notificationsContainer").innerHTML = `
                <div class="state">
                    <div class="state-icon">🔔</div>
                    <h2>You're all caught up</h2>
                    <p>New likes and comments on your posts will appear here.</p>
                </div>
            `;
        }

        function showError() {
            document.getElementById("notificationsContainer").innerHTML = `
                <div class="state">
                    <div class="state-icon">⚠️</div>
                    <h2>Couldn't load notifications</h2>
                    <p>Something went wrong while loading your notifications.</p>
                    <button class="retry-btn" type="button" onclick="loadNotifications()">
                        Try again
                    </button>
                </div>
            `;
        }

        async function markAsRead(id) {
            const { error } = await supabaseClient
                .from("notifications")
                .update({ read: true })
                .eq("id", id)
                .eq("recipient_id", currentUser.id);

            if (error) {
                console.error(error);
                return false;
            }

            return true;
        }

        async function markAllAsRead() {
            const button = document.getElementById("markAllBtn");

            button.disabled = true;
            button.textContent = "Updating...";

            const { error } = await supabaseClient
                .from("notifications")
                .update({ read: true })
                .eq("recipient_id", currentUser.id)
                .eq("read", false);

            if (error) {
                console.error(error);
                alert("Unable to mark notifications as read.");
            }

            await loadNotifications();
        }

        function updateMarkAllButton(list) {
            const button = document.getElementById("markAllBtn");
            const unread = (list || []).some((notification) => !notification.read);

            button.disabled = !unread;
            button.textContent = unread
                ? "Mark all as read"
                : "All notifications read";
        }

        document.addEventListener("click", async (event) => {
            const item = event.target.closest(".notification");

            if (!item) {
                return;
            }

            if (
                item.dataset.read !== "true" &&
                await markAsRead(item.dataset.id)
            ) {
                item.dataset.read = "true";
                item.classList.remove("unread");
                item.querySelector(".unread-label")?.remove();
            }
        });

        document
            .getElementById("markAllBtn")
            .addEventListener("click", markAllAsRead);

        async function initialize() {
            if (!(await getCurrentUser())) {
                return;
            }

            await loadNavUser();
            await loadNotifications();
        }

        initialize();
    </script>
</body>

</html>
