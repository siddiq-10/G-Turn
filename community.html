<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Community | PlaySphere</title>


    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="config.js"></script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: "Inter", sans-serif;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(200,255,0,0.07),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(0,150,255,0.05),
                    transparent 30%
                ),
                #080a0d;

            color: #fff;

            min-height: 100vh;
        }


        /* =========================
           NAVBAR
        ========================= */

        nav {

            height: 72px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 6%;

            position: sticky;

            top: 0;

            z-index: 100;

            background:
                rgba(8,10,13,0.9);

            backdrop-filter: blur(15px);

            border-bottom:
                1px solid rgba(255,255,255,0.08);
        }


        .logo {

            font-family:
                "Barlow Condensed",
                sans-serif;

            font-size: 32px;

            font-weight: 800;

            letter-spacing: 1px;

            color: #c8ff00;
        }


        .nav-links {

            display: flex;

            gap: 30px;
        }


        .nav-links a {

            color: #999;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

            transition: 0.2s;
        }


        .nav-links a:hover {

            color: #c8ff00;
        }


        .user-area {

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .avatar {

            width: 38px;

            height: 38px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #c8ff00;

            color: #080a0d;

            font-weight: 800;
        }


        #navUserName {

            font-size: 14px;

            font-weight: 600;
        }


        /* =========================
           PAGE
        ========================= */

        main {

            width: 88%;

            max-width: 1000px;

            margin: auto;

            padding:
                45px 0 80px;
        }


        .back {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            color: #888;

            text-decoration: none;

            font-size: 13px;

            font-weight: 600;

            margin-bottom: 25px;
        }


        .back:hover {

            color: #c8ff00;
        }


        /* =========================
           COMMUNITY HEADER
        ========================= */

        .community-header {

            position: relative;

            overflow: hidden;

            padding: 38px;

            border-radius: 24px;

            background:
                linear-gradient(
                    135deg,
                    rgba(200,255,0,0.09),
                    rgba(255,255,255,0.035)
                );

            border:
                1px solid rgba(200,255,0,0.18);

            margin-bottom: 28px;
        }


        .community-header::after {

            content: "";

            position: absolute;

            width: 250px;

            height: 250px;

            border-radius: 50%;

            background:
                rgba(200,255,0,0.07);

            right: -100px;

            top: -110px;
        }


        .header-top {

            display: flex;

            align-items: center;

            gap: 20px;

            position: relative;

            z-index: 2;
        }


        .big-icon {

            width: 80px;

            height: 80px;

            border-radius: 20px;

            background:
                rgba(200,255,0,0.12);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 42px;

            flex-shrink: 0;
        }


        .community-header h1 {

            font-family:
                "Barlow Condensed",
                sans-serif;

            text-transform: uppercase;

            font-size:
                clamp(42px,6vw,65px);

            line-height: 0.95;

            margin-bottom: 8px;
        }


        .community-header p {

            color: #9a9da2;

            font-size: 14px;

            line-height: 1.6;

            max-width: 650px;
        }


        .header-bottom {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-top: 30px;

            padding-top: 20px;

            border-top:
                1px solid rgba(255,255,255,0.08);

            position: relative;

            z-index: 2;
        }


        .member-count {

            color: #888;

            font-size: 13px;
        }


        .member-count strong {

            color: white;

            font-size: 16px;
        }


        .join-btn {

            border: none;

            background: #c8ff00;

            color: #080a0d;

            padding: 12px 23px;

            border-radius: 9px;

            font-size: 12px;

            font-weight: 800;

            cursor: pointer;

            transition: 0.2s;
        }


        .join-btn:hover {

            transform: translateY(-2px);
        }


        .join-btn.joined {

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid rgba(200,255,0,0.35);

            color: #c8ff00;
        }


        /* =========================
           CREATE POST
        ========================= */

        .create-post {

            background:
                rgba(255,255,255,0.035);

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 18px;

            padding: 24px;

            margin-bottom: 28px;
        }


        .section-title {

            font-family:
                "Barlow Condensed",
                sans-serif;

            font-size: 27px;

            text-transform: uppercase;

            margin-bottom: 16px;
        }


        textarea {

            width: 100%;

            min-height: 100px;

            resize: vertical;

            padding: 15px;

            border-radius: 12px;

            border:
                1px solid rgba(255,255,255,0.1);

            background:
                rgba(0,0,0,0.25);

            color: white;

            outline: none;

            font-family: inherit;

            font-size: 14px;

            line-height: 1.6;
        }


        textarea:focus {

            border-color:
                rgba(200,255,0,0.45);
        }


        .post-actions {

            display: flex;

            justify-content: flex-end;

            margin-top: 12px;
        }


        .post-btn {

            border: none;

            background: #c8ff00;

            color: #080a0d;

            padding: 11px 22px;

            border-radius: 8px;

            font-size: 12px;

            font-weight: 800;

            cursor: pointer;
        }


        .post-btn:disabled {

            opacity: 0.5;

            cursor: not-allowed;
        }


        /* =========================
           POSTS
        ========================= */

        .posts-section {

            margin-top: 10px;
        }


        .post {

            padding: 22px;

            border-radius: 16px;

            background:
                rgba(255,255,255,0.035);

            border:
                1px solid rgba(255,255,255,0.07);

            margin-bottom: 14px;

            transition: 0.2s;
        }


        .post:hover {

            border-color:
                rgba(255,255,255,0.14);
        }


        .post-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 14px;
        }


        .author {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .author-avatar {

            width: 38px;

            height: 38px;

            border-radius: 50%;

            background:
                rgba(200,255,0,0.13);

            color: #c8ff00;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 13px;

            font-weight: 800;
        }


        .author-name {

            font-size: 13px;

            font-weight: 700;
        }


        .post-time {

            color: #666;

            font-size: 11px;

            margin-top: 3px;
        }


        .delete-btn {

            background: none;

            border: none;

            color: #666;

            cursor: pointer;

            font-size: 12px;
        }


        .delete-btn:hover {

            color: #ff6464;
        }


        .post-content {

            color: #d4d5d7;

            font-size: 14px;

            line-height: 1.7;

            white-space: pre-wrap;

            overflow-wrap: anywhere;
        }


        /* =========================
           EMPTY
        ========================= */

        .empty {

            text-align: center;

            padding: 60px 20px;

            color: #777;
        }


        .empty-icon {

            font-size: 40px;

            margin-bottom: 12px;
        }


        .empty h3 {

            color: #aaa;

            margin-bottom: 6px;
        }


        /* =========================
           LOADING
        ========================= */

        .loading {

            text-align: center;

            padding: 60px;

            color: #777;
        }


        .loading span {

            color: #c8ff00;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 650px) {

            .nav-links {

                display: none;
            }

            #navUserName {

                display: none;
            }

            main {

                width: 92%;

                padding-top: 30px;
            }

            .community-header {

                padding: 25px;
            }

            .header-top {

                align-items: flex-start;
            }

            .big-icon {

                width: 60px;

                height: 60px;

                font-size: 30px;
            }

            .header-bottom {

                align-items: flex-start;

                gap: 15px;

                flex-direction: column;
            }

        }
            .post-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .post-action {
        border: none;
        background: transparent;
        color: #aaa;
        cursor: pointer;
        font-size: 14px;
        padding: 7px 12px;
        border-radius: 8px;
        transition: 0.2s ease;
    }

    .post-action:hover {
        background: rgba(255, 255, 255, 0.08);
        color: white;
    }

    .like-btn.liked {
        color: #ff5c7a;
    }

    .like-btn span:first-child {
        font-size: 16px;
    }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav>

        <div class="logo">
            PLAYSPHERE
        </div>


        <div class="nav-links">

            <a href="dashboard.html">
                Home
            </a>

            <a href="communities.html">
                Communities
            </a>

            <a href="#">
                Events
            </a>

            <a href="#">
                Players
            </a>

        </div>


        <div class="user-area">

            <div
                class="avatar"
                id="navAvatar"
            >
                P
            </div>

            <span id="navUserName">
                Player
            </span>

        </div>

    </nav>



    <!-- =========================
         MAIN
    ========================== -->

    <main>


        <a
            href="communities.html"
            class="back"
        >
            ← Back to Communities
        </a>


        <!-- COMMUNITY HEADER -->

        <section
            class="community-header"
            id="communityHeader"
        >

            <div class="loading">

                Loading
                <span>community...</span>

            </div>

        </section>



        <!-- CREATE POST -->

        <section class="create-post">

            <h2 class="section-title">
                Start a Discussion
            </h2>


            <textarea
                id="postContent"
                placeholder="Share something with the community..."
                maxlength="1000"
            ></textarea>


            <div class="post-actions">

                <button
                    class="post-btn"
                    id="postBtn"
                >
                    Publish Post
                </button>

            </div>

        </section>



        <!-- POSTS -->

        <section class="posts-section">

            <h2 class="section-title">
                Community Discussions
            </h2>


            <div id="postsContainer">

                <div class="loading">

                    Loading
                    <span>discussions...</span>

                </div>

            </div>

        </section>


    </main>



    <script>

        /* =========================
           SUPABASE
        ========================== */

        const { createClient } =
            window.supabase;


        const supabaseClient =
            createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        let currentUser = null;

        let currentCommunity = null;

        let currentMembership = false;


        /* =========================
           SPORT ICONS
        ========================== */

        const sportIcons = {

            Football: "⚽",

            Cricket: "🏏",

            Basketball: "🏀",

            Tennis: "🎾",

            Badminton: "🏸",

            Volleyball: "🏐"

        };


        /* =========================
           GET SLUG
        ========================== */

        function getCommunitySlug() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            return params.get("slug");

        }


        /* =========================
           INITIALIZE
        ========================== */

        async function initialize() {

            const {
                data: {
                    user
                }
            } =
                await supabaseClient
                    .auth
                    .getUser();


            if (!user) {

                window.location.href =
                    "index.html";

                return;

            }


            currentUser = user;


            loadUserInfo();


            const slug =
                getCommunitySlug();


            if (!slug) {

                window.location.href =
                    "communities.html";

                return;

            }


            await loadCommunity(slug);

        }


        /* =========================
           USER INFO
        ========================== */

        function loadUserInfo() {

            const metadata =
                currentUser.user_metadata || {};


            const firstName =
                metadata.first_name ||
                "Player";


            document.getElementById(
                "navUserName"
            ).textContent =
                firstName;


            document.getElementById(
                "navAvatar"
            ).textContent =
                firstName
                    .charAt(0)
                    .toUpperCase();

        }


        /* =========================
           LOAD COMMUNITY
        ========================== */

        async function loadCommunity(slug) {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("communities")
                    .select("*")
                    .eq("slug", slug)
                    .single();


            if (error || !data) {

                document.getElementById(
                    "communityHeader"
                ).innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            😕
                        </div>

                        <h3>
                            Community not found
                        </h3>

                        <p>
                            This community does not exist.
                        </p>

                    </div>

                `;

                return;

            }


            currentCommunity = data;


            renderCommunity();


            await checkMembership();


            await loadPosts();

        }


        /* =========================
           RENDER COMMUNITY
        ========================== */

        function renderCommunity() {

            const icon =
                sportIcons[
                    currentCommunity.sport
                ] || "🏆";


            document.title =
                `${currentCommunity.name} | PlaySphere`;


            document.getElementById(
                "communityHeader"
            ).innerHTML = `

                <div class="header-top">

                    <div class="big-icon">
                        ${icon}
                    </div>

                    <div>

                        <h1>
                            ${currentCommunity.name}
                        </h1>

                        <p>
                            ${currentCommunity.description || ""}
                        </p>

                    </div>

                </div>


                <div class="header-bottom">

                    <div class="member-count">

                        <strong
                            id="memberCount"
                        >
                            ...
                        </strong>

                        members

                    </div>


                    <button
                        id="joinBtn"
                        class="join-btn"
                    >
                        Join Community
                    </button>

                </div>

            `;

        }


        /* =========================
           CHECK MEMBERSHIP
        ========================== */

        async function checkMembership() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("community_members")
                    .select("community_id")
                    .eq(
                        "community_id",
                        currentCommunity.id
                    )
                    .eq(
                        "user_id",
                        currentUser.id
                    )
                    .maybeSingle();


            if (error) {

                console.error(error);

                return;

            }


            currentMembership =
                !!data;


            updateJoinButton();


            await updateMemberCount();

        }


        /* =========================
           MEMBER COUNT
        ========================== */

        async function updateMemberCount() {

            const {
                count,
                error
            } =
                await supabaseClient
                    .from("community_members")
                    .select(
                        "*",
                        {
                            count: "exact",
                            head: true
                        }
                    )
                    .eq(
                        "community_id",
                        currentCommunity.id
                    );


            if (!error) {

                const element =
                    document.getElementById(
                        "memberCount"
                    );


                if (element) {

                    element.textContent =
                        count || 0;

                }

            }

        }


        /* =========================
           JOIN BUTTON
        ========================== */

        function updateJoinButton() {

            const button =
                document.getElementById(
                    "joinBtn"
                );


            if (!button) return;


            if (currentMembership) {

                button.textContent =
                    "✓ Joined";

                button.classList.add(
                    "joined"
                );

            } else {

                button.textContent =
                    "Join Community";

                button.classList.remove(
                    "joined"
                );

            }

        }


        async function toggleMembership() {

            const button =
                document.getElementById(
                    "joinBtn"
                );


            button.disabled = true;


            if (currentMembership) {

                const {
                    error
                } =
                    await supabaseClient
                        .from(
                            "community_members"
                        )
                        .delete()
                        .eq(
                            "community_id",
                            currentCommunity.id
                        )
                        .eq(
                            "user_id",
                            currentUser.id
                        );


                if (error) {

                    alert(error.message);

                    button.disabled = false;

                    return;

                }


                currentMembership = false;

            } else {

                const {
                    error
                } =
                    await supabaseClient
                        .from(
                            "community_members"
                        )
                        .insert({

                            community_id:
                                currentCommunity.id,

                            user_id:
                                currentUser.id

                        });


                if (error) {

                    alert(error.message);

                    button.disabled = false;

                    return;

                }


                currentMembership = true;

            }


            updateJoinButton();

            await updateMemberCount();


            button.disabled = false;

        }


        /* =========================
           LOAD POSTS
        ========================== */

        async function loadPosts() {

            const {
                data: posts,
                error
            } =
                await supabaseClient
                    .from("posts")
                    .select(`
                        id,
                        content,
                        created_at,
                        user_id
                    `)
                    .eq(
                        "community_id",
                        currentCommunity.id
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );
            const postIds = posts.map(post => post.id);

                    let likes = [];

                    if (postIds.length > 0) {
                        const { data: likesData, error: likesError } =
                            await supabaseClient
                                .from("post_likes")
                                .select("post_id, user_id")
                                .in("post_id", postIds);

                        if (likesError) {
                            console.error("Error loading likes:", likesError);
                        } else {
                            likes = likesData || [];
                        }
                    }
            const likeCounts = {};
            const likedByUser = new Set();

                    likes.forEach(like => {
                        likeCounts[like.post_id] =
                            (likeCounts[like.post_id] || 0) + 1;

                        if (like.user_id === currentUser.id) {
                            likedByUser.add(like.post_id);
                        }
                    });
            const enrichedPosts = posts.map(post => ({
                ...post,
                likeCount: likeCounts[post.id] || 0,
                liked: likedByUser.has(post.id)
            }));


            if (error) {

                console.error(error);

                document.getElementById(
                    "postsContainer"
                ).innerHTML = `

                    <div class="empty">

                        <h3>
                            Unable to load discussions
                        </h3>

                        <p>
                            ${error.message}
                        </p>

                    </div>

                `;

                return;

            }


            if (!posts || posts.length === 0) {

                document.getElementById(
                    "postsContainer"
                ).innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            💬
                        </div>

                        <h3>
                            No discussions yet
                        </h3>

                        <p>
                            Be the first person to
                            start a conversation.
                        </p>

                    </div>

                `;

                return;

            }


            renderPosts(posts);

        }


        /* =========================
           RENDER POSTS
        ========================== */

        function renderPosts(posts) {

            const container =
                document.getElementById(
                    "postsContainer"
                );


            container.innerHTML =
                posts.map(
                    post => {

                        const isOwner =
                            post.user_id ===
                            currentUser.id;


                        const metadata =
                            isOwner
                                ? currentUser.user_metadata || {}
                                : {};


                        const firstName =
                            isOwner
                                ? (
                                    metadata.first_name ||
                                    "Player"
                                )
                                : "Player";


                        const initial =
                            firstName
                                .charAt(0)
                                .toUpperCase();


                        return `

                            <article class="post">

                                <div class="post-top">

                                    <div class="author">

                                        <div class="author-avatar">
                                            ${initial}
                                        </div>

                                        <div>

                                            <div class="author-name">
                                                ${firstName}
                                            </div>

                                            <div class="post-time">
                                                ${formatDate(
                                                    post.created_at
                                                )}
                                            </div>

                                        </div>

                                    </div>


                                    ${
                                        isOwner
                                            ? `

                                                <button
                                                    class="delete-btn"
                                                    onclick="deletePost(
                                                        '${post.id}'
                                                    )"
                                                >
                                                    Delete
                                                </button>

                                            `
                                            : ""
                                    }

                                </div>


                                <div class="post-content">
                                    ${escapeHTML(
                                        post.content
                                    )}
                                </div>
                                <div class="post-actions">
                                    <button
                                        class="post-action like-btn ${post.liked ? "liked" : ""}"
                                        onclick="toggleLike('${post.id}', ${post.liked})"
                                    >
                                        <span>${post.liked ? "❤️" : "♡"}</span>
                                        <span id="likes-${post.id}">
                                            ${post.likeCount || 0}
                                        </span>
                                        Like
                                    </button>
                                </div>

                            </article>

                        `;

                    }
                ).join("");

        }


        /* =========================
           CREATE POST
        ========================== */

        document
            .getElementById("postBtn")
            .addEventListener(
                "click",
                createPost
            );


        async function createPost() {

            const textarea =
                document.getElementById(
                    "postContent"
                );


            const content =
                textarea.value.trim();


            if (!content) {

                alert(
                    "Please write something first."
                );

                return;

            }


            const button =
                document.getElementById(
                    "postBtn"
                );


            button.disabled = true;

            button.textContent =
                "Publishing...";


            const {
                error
            } =
                await supabaseClient
                    .from("posts")
                    .insert({

                        community_id:
                            currentCommunity.id,

                        user_id:
                            currentUser.id,

                        content:
                            content

                    });


            if (error) {

                alert(error.message);

                button.disabled = false;

                button.textContent =
                    "Publish Post";

                return;

            }


            textarea.value = "";


            button.disabled = false;

            button.textContent =
                "Publish Post";


            await loadPosts();

        }


        /* =========================
           DELETE POST
        ========================== */

        async function deletePost(
            postId
        ) {

            const confirmed =
                confirm(
                    "Delete this post?"
                );


            if (!confirmed) return;


            const {
                error
            } =
                await supabaseClient
                    .from("posts")
                    .delete()
                    .eq(
                        "id",
                        postId
                    )
                    .eq(
                        "user_id",
                        currentUser.id
                    );


            if (error) {

                alert(error.message);

                return;

            }


            await loadPosts();

        }


        /* =========================
           DATE
        ========================== */

        function formatDate(
            timestamp
        ) {

            const date =
                new Date(timestamp);


            return date.toLocaleString(
                [],
                {
                    dateStyle: "medium",
                    timeStyle: "short"
                }
            );

        }


        /* =========================
           SECURITY
        ========================== */

        function escapeHTML(
            text
        ) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                text;


            return div.innerHTML;

        }


        /* =========================
           BUTTON
        ========================== */

        document.addEventListener(
            "click",
            function(event) {

                if (
                    event.target.id ===
                    "joinBtn"
                ) {

                    toggleMembership();

                }

            }
        );


        /* =========================
           START
        ========================== */
        async function toggleLike(postId, currentlyLiked) {

    if (!currentUser) {
        alert("Please log in to like posts.");
        return;
    }

    try {

        if (currentlyLiked) {

            const { error } =
                await supabaseClient
                    .from("post_likes")
                    .delete()
                    .eq("post_id", postId)
                    .eq("user_id", currentUser.id);

            if (error) {
                throw error;
            }

        } else {

            const { error } =
                await supabaseClient
                    .from("post_likes")
                    .insert({
                        post_id: postId,
                        user_id: currentUser.id
                    });

            if (error) {
                throw error;
            }
        }

        // Reload posts so count and button state stay accurate
        await loadPosts();

    } catch (error) {

        console.error("Like error:", error);

        alert("Unable to update like. Please try again.");
    }
}
        initialize();
