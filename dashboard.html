```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PlaySphere | Dashboard</title>


    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>


    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        :root {

            --bg: #080b0f;

            --card: #11161c;

            --accent: #c8ff00;

            --text: #ffffff;

            --muted: #858d95;

            --border:
                rgba(255,255,255,0.08);

        }


        body {

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(200,255,0,0.08),
                    transparent 30%
                ),
                var(--bg);

            color: var(--text);

            font-family: "Inter", sans-serif;

            min-height: 100vh;

        }


        /* NAVBAR */

        nav {

            height: 75px;

            border-bottom:
                1px solid var(--border);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 6%;

            background:
                rgba(8,11,15,0.85);

            backdrop-filter: blur(15px);

            position: sticky;

            top: 0;

            z-index: 10;

        }


        .logo {

            display: flex;

            align-items: center;

            gap: 10px;

            font-family:
                "Barlow Condensed";

            font-weight: 900;

            font-size: 26px;

        }


        .logo span {

            color: var(--accent);

        }


        .logo-icon {

            background: var(--accent);

            color: #000;

            padding: 7px 9px;

            border-radius: 7px;

        }


        .logout {

            background:
                transparent;

            border:
                1px solid var(--border);

            color: #aaa;

            padding:
                10px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: 600;

        }


        .logout:hover {

            border-color:
                var(--accent);

            color:
                var(--accent);

        }


        /* CONTENT */

        .container {

            width: 90%;

            max-width: 1200px;

            margin:
                60px auto;

        }


        .welcome {

            margin-bottom: 45px;

        }


        .welcome p {

            color: var(--accent);

            font-size: 12px;

            letter-spacing: 2px;

            font-weight: 700;

            margin-bottom: 8px;

        }


        .welcome h1 {

            font-family:
                "Barlow Condensed";

            font-size:
                clamp(45px, 7vw, 75px);

            text-transform:
                uppercase;

            line-height: 0.9;

        }


        .welcome h1 span {

            color: var(--accent);

        }


        /* CARDS */

        .grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

        }


        .card {

            background:
                var(--card);

            border:
                1px solid var(--border);

            border-radius: 18px;

            padding: 28px;

            min-height: 180px;

            transition:
                0.3s;

        }


        .card:hover {

            transform:
                translateY(-5px);

            border-color:
                rgba(200,255,0,0.3);

        }


        .card-icon {

            font-size: 35px;

            margin-bottom: 20px;

        }


        .card h2 {

            font-family:
                "Barlow Condensed";

            font-size: 28px;

            margin-bottom: 7px;

        }


        .card p {

            color:
                var(--muted);

            font-size: 13px;

            line-height: 1.6;

        }


        @media(max-width: 800px) {

            .grid {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


    <nav>


        <div class="logo">

            <div class="logo-icon">
                ⚡
            </div>

            PLAY<span>SPHERE</span>

        </div>


        <button
            class="logout"
            id="logoutBtn">

            LOGOUT

        </button>


    </nav>



    <main class="container">


        <section class="welcome">

            <p>
                WELCOME TO THE COMMUNITY
            </p>


            <h1>

                READY TO<br>

                <span>PLAY?</span>

            </h1>

        </section>



        <section class="grid">


            <div class="card">

                <div class="card-icon">
                    👥
                </div>

                <h2>
                    FIND PLAYERS
                </h2>

                <p>
                    Discover athletes and
                    teammates who share your
                    passion for sports.
                </p>

            </div>



            <div class="card">

                <div class="card-icon">
                    🏆
                </div>

                <h2>
                    JOIN EVENTS
                </h2>

                <p>
                    Find local matches,
                    tournaments and sports
                    events near you.
                </p>

            </div>



            <div class="card">

                <div class="card-icon">
                    📊
                </div>

                <h2>
                    YOUR PROFILE
                </h2>

                <p id="profileText">
                    Loading your profile...
                </p>

            </div>


        </section>


    </main>



    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>


        const SUPABASE_URL =
            "YOUR_SUPABASE_PROJECT_URL";


        const SUPABASE_KEY =
            "YOUR_SUPABASE_PUBLISHABLE_KEY";


        const {
            createClient
        } = window.supabase;


        const supabase =
            createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        /* CHECK LOGIN */

        async function checkUser() {

            const {
                data,
                error
            } =
                await supabase.auth
                    .getUser();


            if (
                error ||
                !data.user
            ) {

                window.location.href =
                    "index.html";

                return;

            }


            const user =
                data.user;


            const firstName =
                user.user_metadata
                    ?.first_name ||
                "Athlete";


            document
                .querySelector(".welcome h1")
                .innerHTML =
                `READY TO<br>
                 <span>PLAY, ${firstName.toUpperCase()}?</span>`;


            const sport =
                user.user_metadata
                    ?.favourite_sport;


            document
                .getElementById(
                    "profileText"
                )
                .textContent =
                sport
                    ? `Your favourite sport is ${sport}. Build your profile and connect with the community.`
                    : "Build your profile and connect with the community.";

        }



        /* LOGOUT */

        document
            .getElementById("logoutBtn")
            .addEventListener(
                "click",
                async () => {

                    await supabase.auth
                        .signOut();

                    window.location.href =
                        "index.html";

                }
            );


        checkUser();

    </script>


</body>

</html>
```
