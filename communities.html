<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Communities | PlaySphere</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Your Supabase configuration -->
    <script src="config.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", sans-serif;
            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(200, 255, 0, 0.08),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(0, 180, 255, 0.06),
                    transparent 30%
                ),
                #080a0d;

            color: #ffffff;
            min-height: 100vh;
        }


        /* =========================
           NAVBAR
        ========================= */

        nav {
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            border-bottom: 1px solid rgba(255,255,255,0.08);

            background: rgba(8,10,13,0.88);

            backdrop-filter: blur(15px);

            position: sticky;
            top: 0;
            z-index: 100;
        }


        .logo {
            font-family: "Barlow Condensed", sans-serif;

            font-size: 32px;
            font-weight: 800;

            letter-spacing: 1px;

            color: #c8ff00;
        }


        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }


        .nav-links a {
            color: #aaa;
            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            transition: 0.2s;
        }


        .nav-links a:hover,
        .nav-links a.active {
            color: #c8ff00;
        }


        .user-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }


        .avatar {
            width: 38px;
            height: 38px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #c8ff00;
            color: #080a0d;

            font-weight: 800;
        }


        #navUserName {
            font-size: 14px;
            font-weight: 600;
        }


        /* =========================
           MAIN
        ========================= */

        main {
            width: 88%;
            max-width: 1250px;

            margin: auto;

            padding: 70px 0;
        }


        .hero {
            text-align: center;

            margin-bottom: 55px;
        }


        .hero-label {
            color: #c8ff00;

            font-family: "Barlow Condensed", sans-serif;

            font-size: 18px;
            font-weight: 700;

            letter-spacing: 3px;

            text-transform: uppercase;

            margin-bottom: 10px;
        }


        .hero h1 {
            font-family: "Barlow Condensed", sans-serif;

            font-size: clamp(48px, 7vw, 82px);

            line-height: 0.95;

            text-transform: uppercase;

            margin-bottom: 18px;
        }


        .hero h1 span {
            color: #c8ff00;
        }


        .hero p {
            color: #9b9da3;

            max-width: 650px;

            margin: auto;

            line-height: 1.7;

            font-size: 15px;
        }


        /* =========================
           SEARCH
        ========================= */

        .toolbar {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 30px;

            gap: 20px;
        }


        .search-box {
            flex: 1;

            max-width: 430px;

            position: relative;
        }


        .search-box input {
            width: 100%;

            padding: 15px 18px 15px 45px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.1);

            background: rgba(255,255,255,0.04);

            color: white;

            outline: none;

            font-size: 14px;
        }


        .search-box input:focus {
            border-color: rgba(200,255,0,0.5);
        }


        .search-icon {
            position: absolute;

            left: 16px;
            top: 50%;

            transform: translateY(-50%);

            color: #888;
        }


        .community-count {
            color: #777;

            font-size: 14px;
        }


        /* =========================
           COMMUNITY GRID
        ========================= */

        .communities-grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 22px;
        }


        .community-card {
            position: relative;

            padding: 28px;

            min-height: 270px;

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.07),
                    rgba(255,255,255,0.025)
                );

            border: 1px solid rgba(255,255,255,0.08);

            overflow: hidden;

            transition:
                transform 0.25s,
                border-color 0.25s,
                box-shadow 0.25s;
        }


        .community-card::before {
            content: "";

            position: absolute;

            width: 130px;
            height: 130px;

            border-radius: 50%;

            background: rgba(200,255,0,0.08);

            top: -55px;
            right: -45px;

            filter: blur(2px);
        }


        .community-card:hover {
            transform: translateY(-6px);

            border-color: rgba(200,255,0,0.4);

            box-shadow:
                0 15px 50px rgba(0,0,0,0.35);
        }


        .sport-icon {
            width: 58px;
            height: 58px;

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(200,255,0,0.1);

            font-size: 29px;

            margin-bottom: 25px;
        }


        .community-card h2 {
            font-family: "Barlow Condensed", sans-serif;

            font-size: 30px;

            text-transform: uppercase;

            margin-bottom: 10px;
        }


        .community-card p {
            color: #91949a;

            font-size: 13px;

            line-height: 1.6;

            min-height: 63px;

            margin-bottom: 22px;
        }


        .community-footer {
            display: flex;

            justify-content: space-between;
            align-items: center;
        }


        .members {
            color: #888;

            font-size: 12px;
        }


        .members strong {
            color: white;

            font-size: 14px;
        }


        .join-btn {
            border: none;

            background: #c8ff00;

            color: #080a0d;

            font-weight: 800;

            font-size: 12px;

            padding: 11px 20px;

            border-radius: 9px;

            cursor: pointer;

            transition: 0.2s;
        }


        .join-btn:hover {
            transform: scale(1.04);
        }


        .join-btn.joined {
            background: rgba(255,255,255,0.08);

            color: #c8ff00;

            border: 1px solid rgba(200,255,0,0.3);
        }


        /* =========================
           EMPTY STATE
        ========================= */

        .empty {
            grid-column: 1 / -1;

            text-align: center;

            padding: 70px 20px;

            color: #777;
        }


        /* =========================
           LOADING
        ========================= */

        .loading {
            grid-column: 1 / -1;

            text-align: center;

            padding: 80px;

            color: #888;
        }


        .loading span {
            color: #c8ff00;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .communities-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .nav-links {
                gap: 15px;
            }

        }


        @media (max-width: 650px) {

            nav {
                padding: 0 5%;
            }

            .nav-links {
                display: none;
            }

            #navUserName {
                display: none;
            }

            main {
                width: 90%;
                padding: 50px 0;
            }

            .communities-grid {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                max-width: none;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav>

        <div class="logo">
            PLAYSPHERE
        </div>


        <div class="nav-links">

            <a href="dashboard.html">
                Home
            </a>

            <a href="communities.html" class="active">
                Communities
            </a>

            <a href="#">
                Events
            </a>

            <a href="#">
                Players
            </a>

        </div>


        <div class="user-area">

            <div
                class="avatar"
                id="navAvatar"
            >
                P
            </div>

            <span id="navUserName">
                Player
            </span>

        </div>

    </nav>



    <!-- =========================
         MAIN
    ========================== -->

    <main>


        <section class="hero">

            <div class="hero-label">
                Find Your People
            </div>

            <h1>
                Join The <span>Game</span>
            </h1>

            <p>
                Discover sports communities, connect with people
                who share your passion, and become part of the
                PlaySphere community.
            </p>

        </section>



        <!-- TOOLBAR -->

        <div class="toolbar">

            <div class="search-box">

                <span class="search-icon">
                    🔎
                </span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search communities..."
                >

            </div>


            <div
                class="community-count"
                id="communityCount"
            >
                Loading communities...
            </div>

        </div>



        <!-- COMMUNITY CARDS -->

        <div
            class="communities-grid"
            id="communitiesGrid"
        >

            <div class="loading">
                Loading <span>communities...</span>
            </div>

        </div>


    </main>



    <script>

        /* =========================
           SUPABASE
        ========================== */

        const { createClient } = window.supabase;

        const supabaseClient = createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        let currentUser = null;

        let allCommunities = [];


        /* =========================
           SPORT ICONS
        ========================== */

        const sportIcons = {

            "Football": "⚽",

            "Cricket": "🏏",

            "Basketball": "🏀",

            "Tennis": "🎾",

            "Badminton": "🏸",

            "Volleyball": "🏐"

        };


        /* =========================
           INITIALIZE
        ========================== */

        async function initialize() {

            const {
                data: {
                    user
                }
            } = await supabaseClient.auth.getUser();


            if (!user) {

                window.location.href = "index.html";

                return;

            }


            currentUser = user;


            loadUserInfo();

            await loadCommunities();

        }


        /* =========================
           USER INFO
        ========================== */

        function loadUserInfo() {

            const metadata =
                currentUser.user_metadata || {};


            const firstName =
                metadata.first_name || "Player";


            const initial =
                firstName.charAt(0).toUpperCase();


            document.getElementById(
                "navUserName"
            ).textContent = firstName;


            document.getElementById(
                "navAvatar"
            ).textContent = initial;

        }


        /* =========================
           LOAD COMMUNITIES
        ========================== */

        async function loadCommunities() {

            const {
                data: communities,
                error
            } = await supabaseClient
                .from("communities")
                .select("*")
                .order("name");


            if (error) {

                console.error(error);

                document.getElementById(
                    "communitiesGrid"
                ).innerHTML = `
                    <div class="empty">
                        <h3>Unable to load communities</h3>
                        <p>${error.message}</p>
                    </div>
                `;

                return;

            }


            allCommunities = communities || [];


            await loadMemberships();

        }


        /* =========================
           LOAD USER MEMBERSHIPS
        ========================== */

        async function loadMemberships() {

            const {
                data: memberships,
                error
            } = await supabaseClient
                .from("community_members")
                .select("community_id")
                .eq("user_id", currentUser.id);


            if (error) {

                console.error(error);

                renderCommunities([]);

                return;

            }


            const joinedIds =
                new Set(
                    memberships.map(
                        membership =>
                            membership.community_id
                    )
                );


            allCommunities =
                allCommunities.map(
                    community => ({

                        ...community,

                        joined:
                            joinedIds.has(
                                community.id
                            )

                    })
                );


            renderCommunities(
                allCommunities
            );

        }


        /* =========================
           RENDER
        ========================== */

        function renderCommunities(
            communities
        ) {

            const grid =
                document.getElementById(
                    "communitiesGrid"
                );


            document.getElementById(
                "communityCount"
            ).textContent =
                `${communities.length} communities`;


            if (!communities.length) {

                grid.innerHTML = `
                    <div class="empty">
                        <h3>No communities found</h3>
                        <p>
                            Try searching for another sport.
                        </p>
                    </div>
                `;

                return;

            }


            grid.innerHTML =
                communities.map(
                    community => `

                    <div class="community-card"
                    onclick="openCommunity('${community.slug}')"
                    style="cursor: pointer;"
                    >

                        <div class="sport-icon">

                            ${
                                sportIcons[
                                    community.sport
                                ] || "🏆"
                            }

                        </div>


                        <h2>
                            ${community.name}
                        </h2>


                        <p>
                            ${community.description || ""}
                        </p>


                        <div class="community-footer">

                            <div class="members">

                                <strong
                                    id="members-${community.id}"
                                >
                                    ...
                                </strong>

                                members

                            </div>


                            <button
                                class="join-btn ${
                                    community.joined
                                        ? "joined"
                                        : ""
                                }"
                                onclick="toggleMembership(
                                    '${community.id}',
                                    ${community.joined}
                                )"
                            >

                                ${
                                    community.joined
                                        ? "✓ Joined"
                                        : "Join Community"
                                }

                            </button>

                        </div>

                    </div>

                `
                ).join("");


            loadMemberCounts(
                communities
            );

        }


        /* =========================
           MEMBER COUNTS
        ========================== */

        async function loadMemberCounts(
            communities
        ) {

            for (
                const community of communities
            ) {

                const {
                    count,
                    error
                } = await supabaseClient
                    .from("community_members")
                    .select(
                        "*",
                        {
                            count: "exact",
                            head: true
                        }
                    )
                    .eq(
                        "community_id",
                        community.id
                    );


                if (!error) {

                    const element =
                        document.getElementById(
                            `members-${community.id}`
                        );


                    if (element) {

                        element.textContent =
                            count || 0;

                    }

                }

            }

        }


        /* =========================
           JOIN / LEAVE
        ========================== */

        async function toggleMembership(
            communityId,
            currentlyJoined
        ) {

            const button =
                event.target;


            button.disabled = true;


            if (currentlyJoined) {

                const {
                    error
                } = await supabaseClient
                    .from("community_members")
                    .delete()
                    .eq(
                        "community_id",
                        communityId
                    )
                    .eq(
                        "user_id",
                        currentUser.id
                    );


                if (error) {

                    alert(error.message);

                    button.disabled = false;

                    return;

                }

            } else {

                const {
                    error
                } = await supabaseClient
                    .from("community_members")
                    .insert({

                        community_id:
                            communityId,

                        user_id:
                            currentUser.id

                    });


                if (error) {

                    alert(error.message);

                    button.disabled = false;

                    return;

                }

            }


            await loadCommunities();

        }


        /* =========================
           SEARCH
        ========================== */

        document
            .getElementById("searchInput")
            .addEventListener(
                "input",
                function () {

                    const search =
                        this.value
                            .toLowerCase()
                            .trim();


                    const filtered =
                        allCommunities.filter(
                            community =>

                                community.name
                                    .toLowerCase()
                                    .includes(search)

                                ||

                                community.sport
                                    .toLowerCase()
                                    .includes(search)

                                ||

                                (
                                    community.description ||
                                    ""
                                )
                                    .toLowerCase()
                                    .includes(search)

                        );


                    renderCommunities(
                        filtered
                    );

                }
            );


        /* =========================
           START
        ========================== */

        initialize();

    </script>

</body>

</html>
